<text x="58" y="119" font-size="46" font-weight="800" fill="#132436">Custom PCB Motor Driver</text>
<text x="58" y="155" font-size="22" font-weight="650" fill="#395260">DRV8848 dual brushed DC motor control for mobile robotics</text>
<text x="58" y="210" font-size="18.5" fill="#425866">Tolerance aware current limiting, thermal screening, BOM traceability,</text>
<text x="58" y="238" font-size="18.5" fill="#425866">KiCad capture, preliminary Rev A Gerbers, and staged release gates.</text>
