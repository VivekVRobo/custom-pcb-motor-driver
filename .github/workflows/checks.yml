name: Engineering Checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  design-verification:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install development dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements-dev.txt
      - name: Compile tooling
        run: python -m compileall -q tools
      - name: Unit tests
        run: pytest -q
      - name: Parse all engineering YAML
        run: |
          python - <<'PY'
          from pathlib import Path
          import yaml
          for path in Path('.').rglob('*.yaml'):
              yaml.safe_load(path.read_text(encoding='utf-8'))
              print('parsed', path)
          PY
      - name: Run electrical and thermal screening
        run: python tools/design_check.py --output artifacts/design-check.json
      - name: Screen example motor profile
        run: python tools/motor_compatibility.py examples/motor_profile_small_gearmotor.yaml
      - name: Lint BOM traceability
        run: python tools/bom_lint.py
      - name: Lint requirements traceability
        run: python tools/requirements_lint.py
      - name: Lint schematic connectivity contract
        run: python tools/netlist_lint.py
      - name: Lint KiCad capture scaffolds
        run: python tools/kicad_source_lint.py
      - name: Generate engineering report
        run: python tools/generate_report.py --output artifacts/design-report.md
      - name: Verify reference release gate
        run: python tools/release_gate.py reference
      - name: Prove CAD gate still requires actual EDA validation
        shell: bash
        run: |
          if python tools/release_gate.py cad-ready; then
            echo 'ERROR: cad-ready passed without verified schematic/footprint/ERC evidence'
            exit 1
          fi
          echo 'Expected: cad-ready remains blocked until actual KiCad evidence exists.'
      - name: Prove fabrication gate still requires evidence
        shell: bash
        run: |
          if python tools/release_gate.py fab-ready; then
            echo 'ERROR: fab-ready passed without CAD/ERC/DRC/Gerber evidence'
            exit 1
          fi
          echo 'Expected: fab-ready remains blocked until real evidence exists.'
      - name: Upload design-check artifacts
        uses: actions/upload-artifact@v4
        with:
          name: engineering-design-checks
          path: artifacts/
          if-no-files-found: error
