name: KiCad Evidence Probe

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/kicad-evidence.yml'
      - 'hardware/cad/**'
      - 'hardware/design_values.yaml'
      - 'tools/release_gate.py'
      - 'tools/kicad_source_lint.py'
  pull_request:
    paths:
      - '.github/workflows/kicad-evidence.yml'
      - 'hardware/cad/**'
      - 'hardware/design_values.yaml'
      - 'tools/release_gate.py'
      - 'tools/kicad_source_lint.py'

permissions:
  contents: read

jobs:
  native-kicad-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install KiCad CLI
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends kicad
          kicad-cli version

      - name: Capture environment
        shell: bash
        run: |
          mkdir -p artifacts/kicad
          {
            echo "commit=$(git rev-parse HEAD)"
            echo "runner_os=${RUNNER_OS:-unknown}"
            echo "runner_arch=${RUNNER_ARCH:-unknown}"
            echo "kicad_version=$(kicad-cli version)"
            uname -a
          } > artifacts/kicad/environment.txt

      - name: Run native schematic ERC
        id: erc
        continue-on-error: true
        shell: bash
        run: |
          kicad-cli sch erc \
            --output artifacts/kicad/erc.rpt \
            hardware/cad/custom_pcb_motor_driver.kicad_sch

      - name: Run native PCB DRC
        id: drc
        continue-on-error: true
        shell: bash
        run: |
          kicad-cli pcb drc \
            --output artifacts/kicad/drc.rpt \
            hardware/cad/custom_pcb_motor_driver.kicad_pcb

      - name: Record CAD evidence state
        shell: bash
        run: |
          {
            echo "erc_outcome=${{ steps.erc.outcome }}"
            echo "drc_outcome=${{ steps.drc.outcome }}"
            echo
            echo 'A successful command only proves that KiCad completed the requested validation.'
            echo 'CAD-ready still requires completed schematic capture, verified footprints, and reviewed clean ERC evidence.'
            echo 'Fab-ready additionally requires completed layout, clean reviewed DRC, and reviewed Gerbers/drills.'
          } > artifacts/kicad/status.txt

      - name: Enforce source/documentation maturity consistency
        run: python tools/kicad_source_lint.py

      - name: Preserve current release truth gates
        shell: bash
        run: |
          if python tools/release_gate.py cad-ready; then
            echo 'ERROR: cad-ready is marked true before the documented evidence milestone is complete.'
            exit 1
          fi
          if python tools/release_gate.py fab-ready; then
            echo 'ERROR: fab-ready is marked true before reviewed fabrication evidence exists.'
            exit 1
          fi
          echo 'Expected: CAD/fabrication gates remain blocked at the current scaffold stage.'

      - name: Upload native KiCad reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kicad-native-validation-evidence
          path: artifacts/kicad/
          if-no-files-found: error
